```html
<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STREET 93 MENU</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:'Inter',sans-serif;

background:#050505;

color:#fff;

overflow-x:hidden;
}

/* BACKGROUND */

body::before{

content:"";

position:fixed;
inset:0;

background:
linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.92)),
url("https://images.unsplash.com/photo-1552566626-52f8b828add9?q=80&w=1800&auto=format&fit=crop");

background-size:cover;
background-position:center;

z-index:-2;
}

body::after{

content:"";

position:fixed;
inset:0;

background:
radial-gradient(circle at top left,
rgba(255,120,0,.18),
transparent 35%),

radial-gradient(circle at bottom right,
rgba(255,80,0,.12),
transparent 35%);

z-index:-1;
}

/* NAVBAR */

nav{

position:sticky;
top:0;

display:flex;
justify-content:space-between;
align-items:center;

padding:22px 7%;

background:rgba(0,0,0,.45);

backdrop-filter:blur(12px);

border-bottom:
1px solid rgba(255,255,255,.08);

z-index:999;
}

.logo{

font-size:52px;

font-weight:900;

letter-spacing:4px;

text-decoration:none;

color:#fff;
}

.logo span{

color:#ffcc00;
}

.back{

padding:14px 24px;

border-radius:14px;

background:
linear-gradient(45deg,#ff7a00,#ffcc00);

color:#000;

text-decoration:none;

font-weight:800;
}

/* LAYOUT */

.menu-page{

display:flex;

gap:50px;

padding:50px 7%;
}

/* SIDEBAR */

.sidebar{

position:sticky;

top:120px;

width:250px;

height:max-content;

display:flex;
flex-direction:column;

gap:16px;
}

.sidebar a{

padding:18px 22px;

background:
rgba(255,255,255,.06);

border:
1px solid rgba(255,255,255,.08);

border-radius:18px;

color:#fff;

text-decoration:none;

font-size:17px;

font-weight:700;

transition:.35s;
}

.sidebar a:hover{

background:
linear-gradient(45deg,#ff7a00,#ffcc00);

color:#000;

transform:translateX(8px);

box-shadow:
0 10px 30px rgba(255,180,0,.35);
}

/* CONTENT */

.menu-content{
flex:1;
}

/* HERO */

.hero{

margin-bottom:60px;
}

.hero h1{

font-size:92px;

font-weight:900;

letter-spacing:8px;

line-height:1;

margin-bottom:18px;
}

.hero p{

font-size:18px;

opacity:.75;

letter-spacing:5px;
}

/* SECTION */

.menu-section{

margin-bottom:90px;
}

.menu-section h2{

font-size:54px;

margin-bottom:30px;

color:#ffcc00;

letter-spacing:3px;
}

/* GRID */

.food-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(320px,1fr));

gap:32px;
}

/* CARD */

.food-card{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

border-radius:28px;

overflow:hidden;

backdrop-filter:blur(14px);

transition:.4s;

box-shadow:
0 0 40px rgba(0,0,0,.4);
}

.food-card:hover{

transform:
translateY(-10px)
scale(1.02);

box-shadow:
0 20px 50px rgba(255,170,0,.22);
}

.food-card img{

width:100%;

height:260px;

object-fit:cover;

transition:.4s;
}

.food-card:hover img{

transform:scale(1.06);
}

.food-info{

padding:24px;
}

.food-info h3{

font-size:28px;

margin-bottom:10px;

font-weight:800;
}

.food-info p{

font-size:15px;

line-height:1.7;

opacity:.72;
}

/* FOOTER */

.footer{

margin-top:80px;

padding:80px 30px;

text-align:center;

border-radius:30px;

background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.88)),
url("https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=1800&auto=format&fit=crop");

background-size:cover;
background-position:center;
}

.footer h2{

font-size:72px;

font-weight:900;

letter-spacing:6px;

margin-bottom:18px;
}

.footer span{

color:#ffcc00;
}

.footer p{

letter-spacing:6px;

opacity:.75;
}

/* MOBILE */

@media(max-width:950px){

.menu-page{

flex-direction:column;
}

.sidebar{

position:relative;

top:0;

width:100%;

flex-direction:row;

overflow:auto;
}

.sidebar a{

white-space:nowrap;
}

.hero h1{

font-size:58px;
}

.menu-section h2{

font-size:40px;
}

.food-grid{

grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<nav>

<a href="index.html" class="logo">
STREET <span>93</span>
</a>

<a href="index.html" class="back">
← Назад
</a>

</nav>

<div class="menu-page">

<!-- SIDEBAR -->

<div class="sidebar">

<a href="#steak">🥩 Стейки</a>
<a href="#mangal">🔥 Мангал</a>
<a href="#salads">🥗 Салаты</a>
<a href="#garnir">🍟 Гарниры</a>
<a href="#sauces">🥫 Соусы</a>
<a href="#drinks">🥤 Напитки</a>

</div>

<!-- CONTENT -->

<div class="menu-content">

<div class="hero">

<h1>STEAK MENU</h1>

<p>
МЯСО • ОГОНЬ • ХАРАКТЕР
</p>

</div>

<!-- MENU ITEMS HERE -->

</div>

</div>

<div class="footer">

<h2>
STREET <span>93</span>
</h2>

<p>
PREMIUM STEAK HOUSE
</p>

</div>

</body>
</html>
```
