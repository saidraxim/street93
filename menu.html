<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street 93 Menu</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Inter,sans-serif;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;

background:
linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.92)),
url("bg.jpg");

background-size:cover;
background-position:center;
background-attachment:fixed;
z-index:-1;
}

nav{
position:sticky;
top:0;
z-index:1000;

padding:18px 8%;

background:rgba(0,0,0,.55);
backdrop-filter:blur(12px);

border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
font-family:Oswald,sans-serif;
font-size:42px;
font-weight:700;
text-decoration:none;
color:#fff;
letter-spacing:2px;
}

.logo span{
color:#ff2d2d;
}

.menu-wrapper{
padding:60px 7%;
}

.hero-title{
text-align:center;
margin-bottom:60px;
}

.hero-title h1{
font-family:Oswald,sans-serif;
font-size:72px;
letter-spacing:8px;
}

.hero-title p{
opacity:.7;
</html>
