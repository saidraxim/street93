<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street93 Reviews</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

header {
  text-align: center;
  padding: 20px;
  background: #111;
}

.box {
  max-width: 500px;
  margin: 20px auto;
  background: #1a1a1a;
  padding: 20px;
  border-radius: 12px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  resize: none;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: gold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.stars span {
  font-size: 26px;
  cursor: pointer;
  color: gray;
}

.stars span.active {
  color: gold;
}

.review {
  max-width: 500px;
  margin: 10px auto;
  background: #222;
  padding: 15px;
  border-radius: 10px;
}

.review img {
  width: 100%;
  margin-top: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h1>🍔 Street93 Reviews</h1>
</header>

<div class="box">
  <h2>Otziv qoldirish ⭐</h2>

  <input id="name" placeholder="Ismingiz">

  <div class="stars" id="stars">
    <span data-value="1">★</span>
    <span data-value="2">★</span>
    <span data-value="3">★</span>
    <span data-value="4">★</span>
    <span data-value="5">★</span>
  </div>

  <textarea id="text" placeholder="Otzivingiz..."></textarea>

  <input type="file" id="image" accept="image/*">

  <button onclick="sendReview()">Yuborish</button>
</div>

<div id="reviews"></div>

<script>
// 🔥 SUPABASE SETUP (TO‘G‘RI)
const supabaseUrl = "https://brypncjzjwfjafjswnbd.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyeXBuY2p6andmamFmanN3bmJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMjA0OTUsImV4cCI6MjA5NDU5NjQ5NX0.Q7-aT2rYdGqP_XxtAz8c-IB31S61s12Lhc4q7QQ-GY8";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

let rating = 0;

// ⭐ stars
document.querySelectorAll(".stars span").forEach(star => {
  star.onclick = () => {
    rating = star.dataset.value;

    document.querySelectorAll(".stars span").forEach(s => s.classList.remove("active"));

    for (let i = 0; i < rating; i++) {
      document.querySelectorAll(".stars span")[i].classList.add("active");
    }
  };
});

// 🚀 SEND REVIEW
async function sendReview() {
  let name = document.getElementById("name").value;
  let text = document.getElementById("text").value;
  let image = document.getElementById("image").files[0];

  if (!name || !text || rating == 0) {
    alert("Hammasini to‘ldiring!");
    return;
  }

  let imageUrl = null;

  // 📸 upload image
  if (image) {
    const fileName = Date.now() + "_" + image.name;

    const { error } = await supabase.storage
      .from("review-images")
      .upload(fileName, image);

    if (!error) {
      imageUrl = supabase.storage
        .from("review-images")
        .getPublicUrl(fileName).data.publicUrl;
    }
  }

  // 💾 save DB
  await supabase.from("reviews").insert({
    name,
    text,
    rating,
    image_url: imageUrl
  });

  loadReviews();
}

// 📥 LOAD REVIEWS
async function loadReviews() {
  const { data } = await supabase
    .from("reviews")
    .select("*")
    .order("created_at", { ascending: false });

  document.getElementById("reviews").innerHTML = "";

  data.forEach(r => {
    document.getElementById("reviews").innerHTML += `
      <div class="review">
        <h3>${r.name}</h3>
        <p>${"⭐".repeat(r.rating)}</p>
        <p>${r.text}</p>
        ${r.image_url ? `<img src="${r.image_url}">` : ""}
      </div>
    `;
  });
}

loadReviews();
</script>

</body>
</html>
