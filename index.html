<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street 93 Restaurant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ====== (HAMMASI O'ZGARMAGAN) ====== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

html{scroll-behavior:smooth;}

body{
  color:#fff;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
  linear-gradient(rgba(0,0,0,0.78),rgba(0,0,0,0.9)),
  url("bg.jpg");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  z-index:-1;
}

/* NAVBAR */

nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 8%;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(12px);
  z-index:1000;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#ffb347;
  cursor:pointer;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:18px;
  opacity:0.7;
  transition:.3s;
}

nav a:hover{
  opacity:1;
  color:#ffb347;
}

/* HERO */

header{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.hero{
  padding:55px;
  border-radius:24px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(18px);
}

.hero h1{
  font-size:clamp(55px,8vw,100px);
  background:linear-gradient(45deg,#fff,#ffb347);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  margin-top:14px;
  opacity:0.85;
  font-size:18px;
}

/* SECTIONS */

section{
  padding:100px 8%;
}

h2{
  text-align:center;
  margin-bottom:35px;
  font-size:38px;
}

/* ABOUT */

.about{
  max-width:900px;
  margin:auto;
  text-align:center;
  line-height:1.9;
  opacity:0.85;
  font-size:17px;
}

/* CONTACT */

.contact{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px;
}

.contact a{
  padding:14px 22px;
  border-radius:14px;
  background:rgba(255,255,255,0.08);
  color:#fff;
  text-decoration:none;
  font-weight:600;
  transition:.3s;
}

.contact a:hover{
  transform:translateY(-4px);
  background:#ff7a00;
}

/* REVIEW */

.review-box{
  max-width:720px;
  margin:auto;
}

input,textarea{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:14px;
  background:rgba(255,255,255,0.08);
  color:#fff;
  outline:none;
}

textarea{
  min-height:120px;
  resize:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(45deg,#ff7a00,#ffb347);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

/* FOOTER */

footer{
  text-align:center;
  padding:30px;
  opacity:0.5;
}

</style>
</head>

<body>

<nav>
<div class="logo" onclick="home()">STREET 93</div>

<div>
<a href="#about">О нас</a>
<a href="#reviews">Отзывы</a>
<a href="#contact">Контакты</a>
</div>
</nav>

<header id="home">
<div class="hero">
<h1>Street 93</h1>
<p>Современный ресторан в Намангане</p>
</div>
</header>

<section id="about">
<h2>О нас</h2>
<div class="about">
Street 93 — это современный ресторан нового поколения...
</div>
</section>

<!-- ❌ MENU SECTION OLIB TASHLANDI -->

<section id="reviews">
<h2>⭐ Отзывы</h2>

<div class="review-box">
<input id="name" placeholder="Ваше имя">
<textarea id="text" placeholder="Ваш отзыв"></textarea>

<button onclick="addReview()">Отправить отзыв</button>

<div id="list"></div>
</div>
</section>

<section id="contact">
<h2>Контакты</h2>

<div class="contact">
<a href="tel:+998882081993">📞 Позвонить</a>
<a href="https://www.google.com/maps?q=40.9981582,71.5957922" target="_blank">📍 Маршрут</a>
<a href="https://www.instagram.com/street.93.restaurant/" target="_blank">📸 Instagram</a>
</div>
</section>

<footer>© 2026 Street 93</footer>

<script>
function home(){
document.getElementById("home").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
