<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street 93</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

/* HEADER */
header {
  text-align: center;
  padding: 40px;
  background: linear-gradient(to right, #000, #222);
}

/* MAP */
#map {
  padding: 20px;
  text-align: center;
}

iframe {
  width: 100%;
  max-width: 900px;
  height: 350px;
  border-radius: 15px;
  border: none;
}

/* REVIEW BOX */
.review-box {
  max-width: 500px;
  margin: 30px auto;
  background: #1a1a1a;
  padding: 20px;
  border-radius: 15px;
}

.review-box input,
.review-box textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}

.review-box button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: gold;
  font-weight: bold;
  cursor: pointer;
}

/* STARS */
.stars {
  font-size: 28px;
  cursor: pointer;
  margin-top: 10px;
}

.stars span {
  color: gray;
}

.stars span.active {
  color: gold;
}

/* REVIEWS */
.review {
  background: #222;
  padding: 15px;
  margin: 10px auto;
  max-width: 500px;
  border-radius: 10px;
}

.review img {
  margin-top: 10px;
  width: 100%;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h1>🍔 Street 93 Restaurant</h1>
  <p>Eng yaxshi atmosfera va taomlar</p>
</header>

<!-- MAP -->
<section id="map">
  <h2>Bizning joylashuv</h2>

  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d546.3092619590175!2d71.59579257587136!3d40.998052485770316!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x38bb4a6aabf1694f%3A0x6330bcfcea57bcca!2sStreet93!5e0!3m2!1sru!2s!4v1779025664681!5m2!1sru!2s"></iframe>
</section>

<!-- REVIEW -->
<div class="review-box">
  <h2>Otziv qoldirish ⭐</h2>

  <input type="text" id="name" placeholder="Ismingiz">

  <div class="stars" id="stars">
    <span data-value="1">★</span>
    <span data-value="2">★</span>
    <span data-value="3">★</span>
    <span data-value="4">★</span>
    <span data-value="5">★</span>
  </div>

  <textarea id="text" placeholder="Otzivingiz..."></textarea>

  <input type="file" id="image" accept="image/*">

  <button onclick="sendReview()">Yuborish</button>
</div>

<div id="reviews"></div>

<script>
let rating = 0;

/* STARS CLICK */
document.querySelectorAll(".stars span").forEach(star => {
  star.addEventListener("click", () => {
    rating = star.dataset.value;

    document.querySelectorAll(".stars span").forEach(s => {
      s.classList.remove("active");
    });

    for (let i = 0; i < rating; i++) {
      document.querySelectorAll(".stars span")[i].classList.add("active");
    }
  });
});

/* SEND REVIEW */
function sendReview() {
  let name = document.getElementById("name").value;
  let text = document.getElementById("text").value;
  let image = document.getElementById("image").files[0];

  if (!name || !text || rating == 0) {
    alert("Hammasini to‘ldiring!");
    return;
  }

  let reader = new FileReader();

  reader.onload = function () {
    let img = reader.result;

    let html = `
      <div class="review">
        <h3>${name}</h3>
        <p>${"⭐".repeat(rating)}</p>
        <p>${text}</p>
        ${img ? `<img src="${img}">` : ""}
      </div>
    `;

    document.getElementById("reviews").innerHTML += html;
  };

  if (image) reader.readAsDataURL(image);
  else reader.onload();
}
</script>

</body>
</html>
