<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Street 93 Restaurant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;}
body{color:#fff;background:#000;}

section{padding:60px 8%;}

.review-box{
  max-width:700px;margin:auto;
}

input,textarea{
  width:100%;padding:12px;margin:8px 0;
  border:none;border-radius:12px;
  background:rgba(255,255,255,0.08);
  color:#fff;
}

button{
  width:100%;padding:12px;
  border:none;border-radius:12px;
  background:linear-gradient(45deg,#ff7a00,#ffb347);
  cursor:pointer;font-weight:700;
}

.stars span{
  font-size:28px;cursor:pointer;color:#555;
}
.stars span.active{color:#ffb347;}

.review{
  margin-top:15px;
  padding:15px;
  border-radius:12px;
  background:rgba(255,255,255,0.06);
}

.review img{
  width:100%;
  margin-top:10px;
  border-radius:12px;
}
</style>
</head>

<body>

<section>
<h2>⭐ Отзывы</h2>

<div class="review-box">

<input id="name" placeholder="Ваше имя">
<textarea id="text" placeholder="Ваш отзыв"></textarea>

<!-- 📷 IMAGE -->
<input type="file" id="image" accept="image/*">

<div class="stars">
  <span onclick="setRating(1)">★</span>
  <span onclick="setRating(2)">★</span>
  <span onclick="setRating(3)">★</span>
  <span onclick="setRating(4)">★</span>
  <span onclick="setRating(5)">★</span>
</div>

<button onclick="addReview()">Отправить</button>

<div id="list"></div>

</div>
</section>

<script>
const SUPABASE_URL = "https://brypncjzjwfjafjswnbd.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_KEY";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let rating = 0;

// ⭐ rating
function setRating(num){
  rating = num;
  document.querySelectorAll(".stars span").forEach((s,i)=>{
    s.classList.toggle("active", i < num);
  });
}

// 📷 upload image
async function uploadImage(file){
  if(!file) return null;

  const fileName = Date.now() + "_" + file.name;

  const { error } = await sb.storage
    .from("reviews")
    .upload(fileName, file);

  if(error){
    console.log(error);
    return null;
  }

  const { data } = sb.storage
    .from("reviews")
    .getPublicUrl(fileName);

  return data.publicUrl;
}

// ➕ add review
async function addReview(){
  const name = document.getElementById("name").value;
  const text = document.getElementById("text").value;
  const file = document.getElementById("image").files[0];

  const imageUrl = await uploadImage(file);

  const { error } = await sb.from("reviews").insert([{
    name,
    text,
    rating,
    image: imageUrl
  }]);

  if(error){
    alert("Xatolik!");
    return;
  }

  loadReviews();
}

// 📥 load reviews
async function loadReviews(){
  const { data } = await sb
    .from("reviews")
    .select("*")
    .order("id", { ascending:false });

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(r=>{
    list.innerHTML += `
      <div class="review">
        <b>${r.name}</b> ⭐ ${r.rating || 0}
        <p>${r.text}</p>
        ${r.image ? `<img src="${r.image}">` : ""}
      </div>
    `;
  });
}

loadReviews();
</script>

</body>
</html>
