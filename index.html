<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Street 93 | Pro Max</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

html{scroll-behavior:smooth}

body{
  color:#fff;
}

/* 🌌 BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.85)),
    url("bg.jpg");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  z-index:-1;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:22px;
  padding:14px;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(14px);
  z-index:100;
}

nav a{
  color:#fff;
  text-decoration:none;
  font-weight:500;
  opacity:0.6;
  transition:0.3s;
}

nav a:hover{
  opacity:1;
  color:#ffb347;
}

/* HERO */
header{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero{
  max-width:700px;
  padding:60px 40px;
  border-radius:25px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);
}

h1{
  font-size:clamp(42px,6vw,80px);
  background:linear-gradient(45deg,#fff,#ffb347);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* SECTIONS */
section{
  padding:100px 10%;
}

h2{
  text-align:center;
  margin-bottom:40px;
}

/* MENU */
.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:22px;
}

.card{
  padding:20px;
  border-radius:18px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-8px);
  background:rgba(255,122,0,0.08);
}

.card h3{color:#ffb347}
.card span{color:#ff7a00;font-weight:700;display:block;margin-top:10px}

/* CONTACT */
.contact{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px;
}

.contact a{
  padding:14px 20px;
  border-radius:14px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.15);
  text-decoration:none;
  color:#fff;
  font-weight:600;
  transition:0.3s;
}

.contact a:hover{
  transform:translateY(-5px);
  color:#ffb347;
}

/* ⭐ REVIEWS */
.review-box{
  max-width:600px;
  margin:auto;
}

input,textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.06);
  color:#fff;
}

button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#ff7a00;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

.review{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
}

/* FOOTER */
footer{
  text-align:center;
  padding:30px;
  opacity:0.5;
  font-size:13px;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <a href="#hero">Street 93</a>
  <a href="#menu">Меню</a>
  <a href="#contact">Контакты</a>
  <a href="#reviews">Отзывы</a>
</nav>

<!-- HERO -->
<header id="hero">
  <div class="hero">
    <h1>Street 93</h1>
    <p>Современный ресторан в Ташкенте</p>
  </div>
</header>

<!-- MENU -->
<section id="menu">
  <h2>Меню</h2>

  <div class="menu">
    <div class="card"><h3>Бургер</h3><span>45 000 so'm</span></div>
    <div class="card"><h3>Пицца</h3><span>75 000 so'm</span></div>
    <div class="card"><h3>Лаваш</h3><span>35 000 so'm</span></div>
    <div class="card"><h3>Напитки</h3><span>10 000 so'm</span></div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <h2>Контакты</h2>

  <div class="contact">
    <a href="tel:+998917613315">📞 Позвонить</a>
    <a href="https://www.google.com/maps?q=40.9981582,71.5957922" target="_blank">📍 Маршрут</a>
    <a href="https://www.instagram.com/street.93.restaurant/" target="_blank">📸 Instagram</a>
  </div>
</section>

<!-- ⭐ REVIEWS -->
<section id="reviews">
  <h2>Отзывы</h2>

  <div class="review-box">
    <input id="name" placeholder="Ваше имя">
    <textarea id="text" placeholder="Ваш отзыв"></textarea>
    <button onclick="addReview()">Отправить</button>

    <div id="list"></div>
  </div>
</section>

<footer>
  © 2026 Street 93
</footer>

<script>
function addReview(){
  let n=document.getElementById("name").value;
  let t=document.getElementById("text").value;

  if(!n||!t)return;

  let data=JSON.parse(localStorage.getItem("r")||"[]");
  data.unshift({n,t});
  localStorage.setItem("r",JSON.stringify(data));

  document.getElementById("name").value="";
  document.getElementById("text").value="";
  load();
}

function load(){
  let data=JSON.parse(localStorage.getItem("r")||"[]");

  document.getElementById("list").innerHTML=
  data.map(r=>`
    <div class="review">
      <b>${r.n}</b><br>${r.t}
    </div>
  `).join("");
}

load();
</script>

</body>
</html>
