<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Street 93</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

html{scroll-behavior:smooth}

body{
  color:#fff;
}

/* 🌌 BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.85)),
    url("bg.jpg");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  z-index:-1;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:25px;
  padding:14px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(12px);
  z-index:100;
}

nav a{
  color:#fff;
  text-decoration:none;
  font-weight:500;
  opacity:0.7;
}

nav a:hover{
  opacity:1;
  color:#ffb347;
}

/* HERO */
header{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero{
  padding:50px;
  border-radius:20px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(18px);
}

h1{
  font-size:clamp(40px,6vw,80px);
  background:linear-gradient(45deg,#fff,#ffb347);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

p{
  margin-top:10px;
  opacity:0.8;
}

/* SECTIONS */
section{
  padding:90px 10%;
}

h2{
  text-align:center;
  margin-bottom:30px;
}

/* MENU */
.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  padding:18px;
  border-radius:16px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(8px);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-8px);
  background:rgba(255,122,0,0.08);
}

.card h3{color:#ffb347}
.card span{color:#ff7a00;font-weight:700}

/* MAP BUTTON */
.map-btn{
  display:inline-block;
  padding:14px 24px;
  background:#ff7a00;
  border-radius:14px;
  color:#fff;
  text-decoration:none;
  font-weight:700;
  transition:0.3s;
}

.map-btn:hover{
  transform:scale(1.05);
}

/* ⭐ REVIEWS */
.review-box{
  max-width:700px;
  margin:auto;
}

input,textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.06);
  color:#fff;
}

input[type="file"]{
  padding:10px;
  background:transparent;
}

button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#ff7a00;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

/* REVIEW CARD */
.review{
  margin-top:15px;
  padding:14px;
  border-radius:14px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
}

.review img{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:30px;
  opacity:0.5;
  font-size:13px;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <a href="#hero">Street 93</a>
  <a href="#menu">Меню</a>
  <a href="#map">Карта</a>
  <a href="#reviews">Отзывы</a>
</nav>

<!-- HERO -->
<header id="hero">
  <div class="hero">
    <h1>Street 93</h1>
    <p>Современный ресторан в Ташкенте</p>
  </div>
</header>

<!-- MENU -->
<section id="menu">
  <h2>Меню</h2>

  <div class="menu">
    <div class="card"><h3>Бургер</h3><span>45 000 so'm</span></div>
    <div class="card"><h3>Пицца</h3><span>75 000 so'm</span></div>
    <div class="card"><h3>Лаваш</h3><span>35 000 so'm</span></div>
    <div class="card"><h3>Напитки</h3><span>10 000 so'm</span></div>
  </div>
</section>

<!-- MAP -->
<section id="map" style="text-align:center">
  <h2>Карта</h2>

  <a class="map-btn"
     href="https://www.google.com/maps?q=40.9981582,71.5957922"
     target="_blank">
     📍 Открыть маршрут
  </a>
</section>

<!-- REVIEWS -->
<section id="reviews">
  <h2>Отзывы</h2>

  <div class="review-box">

    <input id="name" placeholder="Ваше имя">
    <textarea id="text" placeholder="Комментарий"></textarea>
    <input type="file" id="img">

    <button onclick="addReview()">Отправить</button>

    <div id="list"></div>
  </div>
</section>

<footer>
  © 2026 Street 93
</footer>

<script>
function addReview(){
  let name=document.getElementById("name").value;
  let text=document.getElementById("text").value;
  let file=document.getElementById("img").files[0];

  if(!name||!text) return;

  let reader=new FileReader();

  reader.onload=function(){
    let img=reader.result;

    let data=JSON.parse(localStorage.getItem("reviews")||"[]");
    data.unshift({name,text,img});
    localStorage.setItem("reviews",JSON.stringify(data));

    load();
  }

  if(file){
    reader.readAsDataURL(file);
  }else{
    let data=JSON.parse(localStorage.getItem("reviews")||"[]");
    data.unshift({name,text,img:null});
    localStorage.setItem("reviews",JSON.stringify(data));
    load();
  }

  document.getElementById("name").value="";
  document.getElementById("text").value="";
}

function load(){
  let data=JSON.parse(localStorage.getItem("reviews")||"[]");

  document.getElementById("list").innerHTML=
  data.map(r=>`
    <div class="review">
      <b>${r.name}</b><br>
      ${r.text}
      ${r.img ? `<img src="${r.img}">` : ""}
    </div>
  `).join("");
}

load();
</script>

</body>
</html>
