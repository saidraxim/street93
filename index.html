<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street 93</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

/* HEADER */
header {
  text-align: center;
  padding: 30px;
  background: #111;
}

/* MENU */
.menu-item {
  background: #1a1a1a;
  margin: 10px;
  padding: 15px;
  border-radius: 10px;
}

.menu-item h3 {
  color: gold;
}

/* REVIEW */
.review-box {
  max-width: 500px;
  margin: 20px auto;
  background: #1a1a1a;
  padding: 20px;
  border-radius: 15px;
}

.review-box input,
.review-box textarea {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  border: none;
  resize: none;
}

.review-box button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: gold;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.stars span {
  font-size: 25px;
  cursor: pointer;
  color: gray;
}

.stars span.active {
  color: gold;
}

.review {
  background: #222;
  margin: 10px auto;
  padding: 15px;
  border-radius: 10px;
  max-width: 500px;
}

.review img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <h1>🍔 Street 93</h1>
</header>

<!-- MENU -->
<div class="menu-item">
  <h3>Burger</h3>
  <p>Tarkibi: mol go‘shti, pishloq, sous, salat, non</p>
</div>

<div class="menu-item">
  <h3>Lavash</h3>
  <p>Tarkibi: tovuq, lavash noni, sous, sabzavot</p>
</div>

<!-- REVIEW FORM -->
<div class="review-box">
  <h2>Otziv qoldirish ⭐</h2>

  <input id="name" placeholder="Ismingiz">

  <div class="stars" id="stars">
    <span data-value="1">★</span>
    <span data-value="2">★</span>
    <span data-value="3">★</span>
    <span data-value="4">★</span>
    <span data-value="5">★</span>
  </div>

  <textarea id="text" placeholder="Otzivingiz..."></textarea>

  <input type="file" id="image">

  <button onclick="sendReview()">Yuborish</button>
</div>

<div id="reviews"></div>

<script>
// 🔥 SUPABASE CONFIG (SHUNI O'ZGARTIRASAN)
const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let rating = 0;

// ⭐ stars
document.querySelectorAll(".stars span").forEach(star => {
  star.onclick = () => {
    rating = star.dataset.value;

    document.querySelectorAll(".stars span").forEach(s => s.classList.remove("active"));
    for (let i = 0; i < rating; i++) {
      document.querySelectorAll(".stars span")[i].classList.add("active");
    }
  };
});

// 🚀 SEND REVIEW
async function sendReview() {
  let name = document.getElementById("name").value;
  let text = document.getElementById("text").value;
  let imageFile = document.getElementById("image").files[0];

  if (!name || !text || rating == 0) {
    alert("To‘ldiring!");
    return;
  }

  let imageUrl = null;

  // 📸 upload image
  if (imageFile) {
    const fileName = Date.now() + imageFile.name;

    const { data, error } = await supabase.storage
      .from("review-images")
      .upload(fileName, imageFile);

    if (!error) {
      imageUrl = supabase.storage
        .from("review-images")
        .getPublicUrl(fileName).data.publicUrl;
    }
  }

  // 💾 save review
  await supabase.from("reviews").insert({
    name,
    text,
    rating,
    image_url: imageUrl
  });

  loadReviews();
}

// 📥 LOAD REVIEWS
async function loadReviews() {
  const { data } = await supabase
    .from("reviews")
    .select("*")
    .order("created_at", { ascending: false });

  document.getElementById("reviews").innerHTML = data.map(r => `
    <div class="review">
      <h3>${r.name}</h3>
      <p>${"⭐".repeat(r.rating)}</p>
      <p>${r.text}</p>
      ${r.image_url ? `<img src="${r.image_url}">` : ""}
    </div>
  `).join("");
}

loadReviews();
</script>

</body>
</html>
