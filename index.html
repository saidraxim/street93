<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street 93 Restaurant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  color:#fff;
  overflow-x:hidden;
}

/* BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(rgba(0,0,0,0.78),rgba(0,0,0,0.9)),url("bg.jpg");
  background-size:cover;
  background-position:center;
  z-index:-1;
}

/* NAVBAR */
nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 8%;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(12px);
  z-index:1000;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#ffb347;
  cursor:pointer;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:18px;
  opacity:0.7;
}

nav a:hover{
  opacity:1;
  color:#ffb347;
}

/* HERO */
header{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero{
  padding:50px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(18px);
}

.hero h1{
  font-size:60px;
  color:#ffb347;
}

/* SECTIONS */
section{
  padding:100px 8%;
}

h2{
  text-align:center;
  margin-bottom:30px;
}

/* REVIEW */
.review-box{
  max-width:700px;
  margin:auto;
}

input,textarea{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,0.08);
  color:#fff;
}

textarea{
  min-height:120px;
  resize:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(45deg,#ff7a00,#ffb347);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

/* REVIEW CARD */
.review{
  margin-top:15px;
  padding:15px;
  border-radius:12px;
  background:rgba(255,255,255,0.06);
}

.review img{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}

footer{
  text-align:center;
  padding:30px;
  opacity:0.5;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
<div class="logo" onclick="home()">STREET 93</div>

<div>
<a href="#about">О нас</a>
<a href="#reviews">Отзывы</a>
<a href="#contact">Контакты</a>
</div>
</nav>

<!-- HERO -->
<header id="home">
<div class="hero">
<h1>Street 93</h1>
<p>Современный ресторан в Намангане</p>
</div>
</header>

<!-- ABOUT -->
<section id="about">
<h2>О нас</h2>
<p style="text-align:center;opacity:0.8;">
Street 93 — премиальный ресторан с современным стилем и вкусной кухней.
</p>
</section>

<!-- REVIEWS -->
<section id="reviews">
<h2>Отзывы</h2>

<div class="review-box">

<input id="name" placeholder="Ваше имя">
<textarea id="text" placeholder="Ваш отзыв"></textarea>

<input type="file" id="img" accept="image/*">

<button onclick="addReview()">Отправить отзыв</button>

<div id="list"></div>

</div>
</section>

<!-- CONTACT -->
<section id="contact">
<h2>Контакты</h2>

<div style="text-align:center;">
<p>📞 +998 88 208 19 93</p>
<p>📍 Namangan</p>
</div>
</section>

<footer>© 2026 Street 93</footer>

<script>

/* SUPABASE */
const SUPABASE_URL = "https://brypncjzjwfjafjswnbd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyeXBuY2p6andmamFmanN3bmJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMjA0OTUsImV4cCI6MjA5NDU5NjQ5NX0.Q7-aT2rYdGqP_XxtAz8c-IB31S61s12Lhc4q7QQ-GY8";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* UPLOAD IMAGE */
async function uploadImage(file){

const fileName = Date.now() + "_" + file.name;

let { error } = await sb.storage
.from("reviews")
.upload(fileName, file);

if(error){
alert("Ошибка загрузки фото");
return "";
}

const { data } = sb.storage
.from("reviews")
.getPublicUrl(fileName);

return data.publicUrl;
}

/* ADD REVIEW */
async function addReview(){

let name = document.getElementById("name").value;
let text = document.getElementById("text").value;
let file = document.getElementById("img").files[0];

if(!name || !text){
alert("Заполните все поля");
return;
}

let imgUrl = "";

if(file){
imgUrl = await uploadImage(file);
}

await sb.from("reviews").insert([{
name,
text,
img: imgUrl
}]);

document.getElementById("name").value="";
document.getElementById("text").value="";
document.getElementById("img").value="";

load();
}

/* LOAD REVIEWS */
async function load(){

let { data } = await sb
.from("reviews")
.select("*")
.order("id",{ascending:false});

document.getElementById("list").innerHTML =
data.map(r=>`
<div class="review">
<b>${r.name}</b>
<div>${r.text}</div>
${r.img ? `<img src="${r.img}">` : ""}
</div>
`).join("");
}

/* HOME */
function home(){
document.getElementById("home").scrollIntoView({behavior:"smooth"});
}

load();

</script>

</body>
</html>
